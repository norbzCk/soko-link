services:
  # =========================
  # FRONTEND - React/Vite
  # =========================
  - type: web
    runtime: static
    name: sokolink-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    autoDeployTrigger: commit

    envVars:
      - key: VITE_API_BASE
        value: https://sales-backend.onrender.com

      - key: VITE_AGENT_API_BASE
        value: https://sokolink-agent.onrender.com

      - key: VITE_SUPABASE_URL
        value: https://jjryzuwfzneyxtkkjejd.supabase.co

      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_i3sqYYX9aT1ftZ98JuHXdg_Wr-jaNbE

    routes:
      - type: rewrite
        source: /*
        destination: /index.html


  # =========================
  # BACKEND - FastAPI
  # =========================
  - type: web
    name: sales-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    pullRequestPreviewsEnabled: false

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sales-db
          property: connectionString

      - key: APP_ENV
        value: production

      - key: FRONTEND_URL
        value: https://sokolink-frontend.onrender.com

      - key: SUPABASE_URL
        value: https://jjryzuwfzneyxtkkjejd.supabase.co

      - key: SUPABASE_JWKS_URL
        value: https://jjryzuwfzneyxtkkjejd.supabase.co/auth/v1/.well-known/jwks.json

      - key: SUPABASE_DATABASE_URL
        sync: false

      - key: APP_SECRET_KEY
        generateValue: true

      - key: CORS_ORIGINS
        value: "https://sokolink-frontend.onrender.com"

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_USERNAME
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: SMTP_FROM_EMAIL
        sync: false

      - key: SMTP_FROM_NAME
        value: Soko-Link

      - key: SMTP_USE_TLS
        value: "true"


# =========================
# POSTGRESQL DATABASE
# =========================
databases:
  - name: sales-db
    databaseName: sales_db
    user: sales_user
