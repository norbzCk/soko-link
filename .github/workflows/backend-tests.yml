name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "alembic/**"
      - "requirements*.txt"
      - "pytest.ini"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test.db
      APP_SECRET_KEY: test-secret-key-that-is-at-least-32-bytes-long
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
