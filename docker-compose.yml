services:
  db:
    image: postgres:16-alpine
    container_name: sokolink-postgres
    environment:
      POSTGRES_DB: sokolink_db
      POSTGRES_USER: sokolink_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - sokolink_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sokolink_user -d sokolink_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DB_HOST: db
      DB_USER: sokolink_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env}
      DB_NAME: sokolink_db
      DB_PORT: "5432"
      APP_ENV: development
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in your local .env}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sokolink_postgres_data:
    name: sokolink_postgres_data
